name: build-android

on:
  push:
    branches: [main]
    paths-ignore: ['uploads/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Workflow version marker
        run: echo "build.yml v3 (no setup-android)"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK from preinstalled SDK
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache ffmpeg build
        id: ffcache
        uses: actions/cache@v4
        with:
          path: third_party/out
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg and ffprobe
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh

      - name: Load release keystore from secret
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::KEYSTORE_B64 تنظیم نشده. workflow با نام setup-keystore را یک‌بار اجرا کنید"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Rust libraries and copy ffmpeg
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o android/app/src/main/jniLibs build --release
          for abi in arm64-v8a armeabi-v7a; do
            cp third_party/out/$abi/bin/ffmpeg android/app/src/main/jniLibs/$abi/libffmpeg.so
            cp third_party/out/$abi/bin/ffprobe android/app/src/main/jniLibs/$abi/libffprobe.so
          done

      - name: Build split APKs
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
