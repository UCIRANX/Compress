# یک‌بار اجرا می‌شود. keystore را می‌سازد و فقط در GitHub Secrets ذخیره می‌کند.
# فایل keystore هرگز داخل ریپو commit نمی‌شود.
name: setup-keystore

on:
  workflow_dispatch:

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to overwrite an existing keystore
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^KEYSTORE_B64'; then
            echo "::error::KEYSTORE_B64 از قبل وجود دارد. برای جلوگیری از شکستن آپدیت‌ها، ادامه نمی‌دهم."
            exit 1
          fi

      - name: Generate keystore and random password
        run: |
          PASS=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 32)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore release.jks -alias release \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Compressor"
          base64 -w0 release.jks > release.b64
          echo "PASS=$PASS" >> "$GITHUB_ENV"

      - name: Save to GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          gh secret set KEYSTORE_B64 --repo "$GITHUB_REPOSITORY" < release.b64
          printf '%s' "$PASS" | gh secret set KEYSTORE_PASS --repo "$GITHUB_REPOSITORY"
          rm -f release.jks release.b64
